<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f5">
  <title>Meine Filament-Bibliothek</title>

  <style>
    :root {
      color-scheme: light;
      --background: #f5f5f5;
      --card-background: #ffffff;
      --text: #202020;
      --muted: #737373;
      --border: #e8e8e8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 40px 28px 64px;
    }

    .page-header {
      margin-bottom: 42px;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    .filament-section {
      margin-bottom: 44px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -0.5px;
    }

    .section-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }

    .product-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-background);
      color: inherit;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgb(0 0 0 / 6%);
    }

    .product-card:focus-visible,
    .shop-links a:focus-visible {
      outline: 3px solid #777;
      outline-offset: 3px;
    }

    .product-image {
      display: flex;
      aspect-ratio: 1 / 1;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      background: #ffffff;
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 18px;
    }

    .product-name {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
    }

    .product-type {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .product-price {
      margin-top: auto;
      padding-top: 22px;
      font-size: 18px;
      font-weight: 700;
    }

    .product-unit {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .product-link-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .product-link-label span:last-child {
      font-size: 17px;
    }

    .shop-section {
      margin-top: 56px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .shop-section h2 {
      margin: 0;
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -0.5px;
    }

    .shop-section p {
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .shop-links {
      margin: 0;
      padding-left: 20px;
      font-size: 14px;
      line-height: 1.9;
    }

    .shop-links a {
      color: var(--text);
      text-decoration: underline;
      text-decoration-color: #b7b7b7;
      text-underline-offset: 3px;
    }

    .shop-links a:hover {
      text-decoration-color: var(--text);
    }

    @media (max-width: 1000px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .container {
        padding-right: 20px;
        padding-left: 20px;
      }
    }

    @media (max-width: 650px) {
      .container {
        padding: 26px 14px 44px;
      }

      .page-header {
        margin-bottom: 30px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .product-info {
        padding: 13px;
      }

      .product-name {
        font-size: 16px;
      }

      .product-type {
        font-size: 12px;
      }

      .product-price {
        padding-top: 18px;
        font-size: 16px;
      }

      .product-unit {
        font-size: 12px;
      }

      .product-link-label {
        font-size: 11px;
      }

      .section-header h2,
      .shop-section h2 {
        font-size: 21px;
      }

      .shop-section {
        margin-top: 40px;
        padding-top: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .product-card {
        transition: none;
      }

      .product-card:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="page-header">
      <h1>Meine Filament-Bibliothek</h1>
    </header>

    <div id="filament-library"></div>

    <section class="shop-section" aria-labelledby="shop-heading">
      <h2 id="shop-heading">Nicht gefunden, was du gerne hättest?</h2>
      <p>Hier findest du weitere Filamente in den offiziellen Shops.</p>

      <ul class="shop-links">
        <li>
          <a
            href="https://eu.store.bambulab.com/de/collections/bambu-lab-3d-printer-filament?Durch+Material=PLA%2CPETG&Druckertyp=F%C3%BCr+die+P+Serie&Kompatibilit%C3%A4t=Kompatibel+mit+AMS&page=1"
            target="_blank"
            rel="noopener noreferrer"
          >Bambu Lab – Filament für die P-Serie</a>
        </li>
        <li>
          <a
            href="https://de.store.sunlu.com/collections/3d-drucker-filament?filter.v.availability=1"
            target="_blank"
            rel="noopener noreferrer"
          >SUNLU – Verfügbare Filamente</a>
        </li>
      </ul>
    </section>
  </main>

  <script>
    const filaments = [
      {
        type: "PLA Silk+",
        color: "Candy Red",
        price: 25.99,
        unit: "1 kg",
        productUrl:
          "https://eu.store.bambulab.com/de/products/pla-silk-upgrade?id=53583205695836",
        imageUrl:
          "https://store.bblcdn.eu/s8/default/2309fbc5069f4f60bcfaefd2b9514dd0/PLA_Silk_5.jpg__op__resize,m_lfit,w_1920__op__format,f_auto__op__quality,q_80"
      },
      {
        type: "PLA Silk+",
        color: "Gold-Rosa",
        price: 19.99,
        unit: "1 kg",
        productUrl:
          "https://eu.store.bambulab.com/de/products/pla-silk-upgrade?id=53583205957980",
        imageUrl:
          "https://store.bblcdn.eu/s8/default/bc09443440a541a693ac8e515931f554/PLA_Silk_10.jpg__op__resize,m_lfit,w_1920__op__format,f_auto__op__quality,q_80"
      },
      {
        type: "PLA Matte",
        color: "Nardo Gray",
        price: 22.99,
        unit: "1 kg",
        productUrl:
          "https://eu.store.bambulab.com/de/products/pla-matte?id=53926028837212",
        imageUrl:
          "https://store.bblcdn.eu/s8/default/e5bc5b447e304021a85fc07ff9016999/1_ea5b7083-7377-4995-bef2-6c066be034b2.jpg__op__resize,m_lfit,w_1920__op__format,f_auto__op__quality,q_80"
      },
      {
        type: "PLA Matte",
        color: "Bone White",
        price: 22.99,
        unit: "1 kg",
        productUrl:
          "https://eu.store.bambulab.com/de/products/pla-matte?id=53926028607836",
        imageUrl:
          "https://store.bblcdn.eu/s8/default/af6a90b958ac4ad980f3c32bab4dcfd5/7_890c24b1-12ea-47e1-908a-c8c8afb2b48c.jpg__op__resize,m_lfit,w_1920__op__format,f_auto__op__quality,q_80"
      },
      {
        type: "PLA Metal",
        color: "Metallisches Kobaltblau",
        price: 27.99,
        unit: "1 kg",
        productUrl:
          "https://eu.store.bambulab.com/de/products/pla-metal?id=43959185244379",
        imageUrl:
          "https://store.bblcdn.eu/s8/default/a8cb6b37d9d8430b88743d1784093c1a/A02-B2-1.75-1000-spl.png__op__resize,m_lfit,w_1920__op__format,f_auto__op__quality,q_80"
      }
    ];

    const library = document.getElementById("filament-library");

    const groupedFilaments = filaments.reduce((groups, filament) => {
      if (!groups[filament.type]) {
        groups[filament.type] = [];
      }

      groups[filament.type].push(filament);
      return groups;
    }, {});

    Object.entries(groupedFilaments).forEach(([type, products]) => {
      const section = document.createElement("section");
      section.className = "filament-section";

      const header = document.createElement("div");
      header.className = "section-header";

      const heading = document.createElement("h2");
      heading.textContent = type;

      const count = document.createElement("span");
      count.className = "section-count";
      count.textContent =
        `${products.length} ${products.length === 1 ? "Filament" : "Filamente"}`;

      header.append(heading, count);

      const grid = document.createElement("div");
      grid.className = "product-grid";

      products.forEach((product) => {
        const card = document.createElement("a");
        card.className = "product-card";
        card.href = product.productUrl;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.setAttribute(
          "aria-label",
          `${product.color} – ${product.type} im offiziellen Shop öffnen`
        );

        const imageContainer = document.createElement("div");
        imageContainer.className = "product-image";

        const image = document.createElement("img");
        image.src = product.imageUrl;
        image.alt = `${product.color} – ${product.type}`;
        image.loading = "lazy";
        image.decoding = "async";

        imageContainer.appendChild(image);

        const info = document.createElement("div");
        info.className = "product-info";

        const name = document.createElement("h3");
        name.className = "product-name";
        name.textContent = product.color;

        const productType = document.createElement("div");
        productType.className = "product-type";
        productType.textContent = product.type;

        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = product.price.toLocaleString("de-DE", {
          style: "currency",
          currency: "EUR"
        });

        const unit = document.createElement("div");
        unit.className = "product-unit";
        unit.textContent = `/ Rolle · ${product.unit}`;

        const linkLabel = document.createElement("div");
        linkLabel.className = "product-link-label";

        const linkText = document.createElement("span");
        linkText.textContent = "Details";

        const arrow = document.createElement("span");
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "↗";

        linkLabel.append(linkText, arrow);

        info.append(name, productType, price, unit, linkLabel);
        card.append(imageContainer, info);
        grid.appendChild(card);
      });

      section.append(header, grid);
      library.appendChild(section);
    });
  </script>
</body>
</html>
