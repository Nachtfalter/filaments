<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filament Bibliothek</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  color: #222;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

main {
  max-width: 1450px;
  margin: auto;
  padding: 42px 28px 60px;
}

h1 {
  margin: 0 0 10px;
  font-size: clamp(28px, 4vw, 38px);
  font-weight: 600;
}

.subtitle {
  margin: 0 0 34px;
  color: #777;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 32px 24px;
}

.card {
  width: 100%;
  max-width: 300px;
  justify-self: center;
}

.image-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #f2f2f2;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.color-preview {
  width: 100%;
  height: 100%;
  background: var(--filament-color);
}

.details {
  padding: 15px 2px 0;
}

.brand {
  margin: 0 0 7px;
  color: #777;
  font-size: 13px;
}

h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.35;
  font-weight: 500;
}

.material {
  margin: 7px 0 14px;
  color: #777;
  font-size: 14px;
}

.price {
  margin: 0 0 17px;
  color: #f15a24;
  font-size: 21px;
  font-weight: 600;
}

.price small {
  display: block;
  margin-top: 4px;
  color: #888;
  font-size: 13px;
  font-weight: 400;
}

.product-link {
  display: inline-block;
  color: #222;
  text-decoration: none;
  border-bottom: 1px solid #999;
  padding-bottom: 3px;
  font-size: 14px;
}

.product-link:hover {
  color: #f15a24;
  border-color: #f15a24;
}

@media (max-width: 600px) {
  main { padding: 26px 16px 40px; }
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 26px 14px;
  }
  .card { max-width: none; }
  h2 { font-size: 17px; }
  .price { font-size: 17px; }
}
</style>
</head>

<body>
<main>
  <h1>Filament Bibliothek</h1>
  <p class="subtitle">Meine Filamente auf einen Blick.</p>

  <section class="grid">

    <!-- JADE WHITE -->
    <article class="card">
      <div class="image-box">
        <div class="color-preview" style="--filament-color:#f7f7f3"></div>
      </div>
      <div class="details">
        <p class="brand">Bambu Lab</p>
        <h2>Jade White</h2>
        <p class="material">PLA Basic</p>
        <p class="price">22,99 €
          <small>/ Rolle 1 kg</small>
        </p>
        <a class="product-link"
           href="https://eu.store.bambulab.com/products/pla-basic-filament"
           target="_blank" rel="noopener noreferrer">
          Produkt ansehen ↗
        </a>
      </div>
    </article>

    <!-- CANDY RED -->
    <article class="card">
      <div class="image-box">
        <img
          src="https://store.bblcdn.com/s3/default/837fde7ee7f14b36ac6ee221f89eab94/img_v3_02i5_d4873199-3116-466a-b2b9-e819b7db0e3g.jpg"
          alt="Bambu Lab PLA Silk+ Candy Red">
      </div>
      <div class="details">
        <p class="brand">Bambu Lab</p>
        <h2>Candy Red</h2>
        <p class="material">PLA Silk+</p>
        <p class="price">25,99 €
          <small>/ Rolle 1 kg</small>
        </p>
        <a class="product-link"
           href="https://eu.store.bambulab.com/products/pla-silk-upgrade"
           target="_blank" rel="noopener noreferrer">
          Produkt ansehen ↗
        </a>
      </div>
    </article>

    <!-- NARDO GRAY -->
    <article class="card">
      <div class="image-box">
        <div class="color-preview" style="--filament-color:#858781"></div>
      </div>
      <div class="details">
        <p class="brand">Bambu Lab</p>
        <h2>Nardo Gray</h2>
        <p class="material">PLA Matte</p>
        <p class="price">22,99 €
          <small>/ Rolle 1 kg</small>
        </p>
        <a class="product-link"
           href="https://eu.store.bambulab.com/products/pla-matte-filament"
           target="_blank" rel="noopener noreferrer">
          Produkt ansehen ↗
        </a>
      </div>
    </article>

  </section>
</main>
</body>
</html>
