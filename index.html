<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filament Bibliothek</title>

<style>
:root {
  --background: #ffffff;
  --text: #222222;
  --muted: #777777;
  --border: #eeeeee;
  --accent: #f36b35;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

main {
  max-width: 1450px;
  margin: 0 auto;
  padding: 40px 28px 60px;
}

header {
  margin-bottom: 34px;
}

h1 {
  margin: 0;
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -1px;
}

.subtitle {
  margin-top: 10px;
  color: var(--muted);
  font-size: 15px;
}

/* Gleichmäßiges Produktkarten-Raster */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 30px 24px;
  align-items: start;
  max-width: 1200px;
}

/* Jede Karte erhält dieselbe Breite */
.card {
  width: 100%;
  max-width: 280px;
  justify-self: center;
  min-width: 0;
}

.image-box {
  width: 100%;
  height: 260px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f5f5;
  overflow: hidden;
}

.image-box img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  mix-blend-mode: multiply;
  transition: transform 180ms ease;
}

.card:hover .image-box img {
  transform: scale(1.035);
}

.details {
  padding: 15px 2px 0;
}

.brand {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 7px;
}

h2 {
  margin: 0;
  font-size: 21px;
  line-height: 1.3;
  font-weight: 500;
}

.material {
  margin: 7px 0 13px;
  font-size: 14px;
  color: var(--muted);
}

.price {
  margin: 0 0 17px;
  font-size: 20px;
  font-weight: 600;
  color: var(--accent);
}

.price small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
}

.product-link {
  display: inline-block;
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px solid #999;
  padding-bottom: 3px;
  font-size: 14px;
}

.product-link:hover {
  color: var(--accent);
  border-color: var(--accent);
}

@media (max-width: 600px) {
  main {
    padding: 26px 16px 40px;
  }

  h1 {
    font-size: 29px;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px 14px;
  }

  .card {
    max-width: none;
  }

  .image-box {
    height: auto;
    aspect-ratio: 1 / 1;
    padding: 8px;
  }

  h2 {
    font-size: 17px;
  }

  .price {
    font-size: 17px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>Filament Bibliothek</h1>
  <p class="subtitle">Meine Filamente auf einen Blick.</p>
</header>

<section class="grid">

  <!-- FILAMENT 1: JADE WHITE -->
  <article class="card">
    <div class="image-box">
      <img
        src="https://botland.com.pl/img/art/inne/24284_2.jpg"
        alt="Bambu Lab PLA Basic Jade White auf Spule"
        loading="lazy">
    </div>

    <div class="details">
      <p class="brand">Bambu Lab</p>
      <h2>PLA Basic – Jade White</h2>
      <p class="material">PLA Basic · 1 kg</p>
      <p class="price">25,99 € <small>/ Rolle mit Spule</small></p>

      <a
        class="product-link"
        href="https://www.3djake.de/bambu-lab/pla-basic-jade-white"
        target="_blank"
        rel="noopener noreferrer">
        Produkt ansehen ↗
      </a>
    </div>
  </article>

  <!-- FILAMENT 2: CANDY RED -->
  <article class="card">
    <div class="image-box">
      <img
        src="https://store.bblcdn.com/s3/default/837fde7ee7f14b36ac6ee221f89eab94/img_v3_02i5_d4873199-3116-466a-b2b9-e819b7db0e3g.jpg"
        alt="Bambu Lab PLA Silk Plus Candy Red"
        loading="lazy">
    </div>

    <div class="details">
      <p class="brand">Bambu Lab</p>
      <h2>PLA Silk+ – Candy Red</h2>
      <p class="material">PLA Silk+ · 1 kg</p>
      <p class="price">25,99 € <small>/ Rolle mit Spule</small></p>

      <a
        class="product-link"
        href="https://eu.store.bambulab.com/products/pla-silk-upgrade"
        target="_blank"
        rel="noopener noreferrer">
        Produkt ansehen ↗
      </a>
    </div>
  </article>

</section>
</main>
</body>
</html>
