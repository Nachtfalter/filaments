
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meine Filament-Bibliothek – eine Übersicht meiner 3D-Druck-Filamente.">
  <title>Meine Filament-Bibliothek</title>

  <style>
    :root {
      --background: #f5f5f5;
      --card: #ffffff;
      --text: #202020;
      --muted: #707070;
      --border: #e6e6e6;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 28px 64px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.2;
      letter-spacing: -0.8px;
    }

    .intro {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 0 0 40px;
    }

    .intro-item {
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .intro-item h2 {
      margin: 0 0 6px;
      font-size: 18px;
      line-height: 1.3;
    }

    .intro-item p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .filament-group {
      margin-bottom: 42px;
    }

    .filament-group h2 {
      margin: 0 0 18px;
      font-size: 23px;
      line-height: 1.3;
      letter-spacing: -0.3px;
    }

    .filament-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .filament-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .filament-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .filament-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 18px;
      background: #ffffff;
    }

    .filament-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .filament-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 16px;
    }

    .filament-name {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .filament-type {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .filament-price {
      margin-top: auto;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.4;
    }

    .filament-unit {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .filament-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
    }

    .filament-details span:last-child {
      font-size: 17px;
    }

    .shops {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .shops h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .shop-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .shop-links a {
      color: var(--text);
      text-decoration: none;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-size: 14px;
    }

    .shop-links a:hover {
      border-color: #bdbdbd;
    }

    a:focus-visible {
      outline: 3px solid #555;
      outline-offset: 3px;
    }

    @media (max-width: 1000px) {
      .filament-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .container {
        padding: 28px 16px 48px;
      }

      .intro {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 32px;
      }

      .filament-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .filament-image {
        padding: 12px;
      }

      .filament-info {
        padding: 12px;
      }

      .filament-name {
        font-size: 15px;
      }

      .filament-price {
        font-size: 16px;
      }

      .filament-details {
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .filament-card {
        transition: none;
      }

      .filament-card:hover {
        transform: none;
      }
    }
  </style>
</head>

      "PETG"

    const groupsContainer = document.getElementById("filament-groups");

    function createFilamentCard(filament) {
      const card = document.createElement("a");
      card.className = "filament-card";
      card.href = filament.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.setAttribute("aria-label", `${filament.name}, ${filament.type} – Details öffnen`);

      const imageContainer = document.createElement("div");
      imageContainer.className = "filament-image";

      const image = document.createElement("img");
      image.src = filament.image;
      image.alt = filament.name;
      image.loading = "lazy";
      image.decoding = "async";
      imageContainer.appendChild(image);

      const info = document.createElement("div");
      info.className = "filament-info";

      const name = document.createElement("h3");
      name.className = "filament-name";
      name.textContent = filament.name;

      const type = document.createElement("p");
      type.className = "filament-type";
      type.textContent = filament.type;

      const price = document.createElement("div");
      price.className = "filament-price";
      price.textContent = filament.price.toLocaleString("de-DE", {
        style: "currency",
        currency: "EUR"
      });

      const unit = document.createElement("div");
      unit.className = "filament-unit";
      unit.textContent = filament.unit;

      const details = document.createElement("div");
      details.className = "filament-details";

      const detailsLabel = document.createElement("span");
      detailsLabel.textContent = "Details";

      const arrow = document.createElement("span");
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "↗";

      details.append(detailsLabel, arrow);
      info.append(name, type, price, unit, details);
      card.append(imageContainer, info);

      return card;
    }

    typeOrder.forEach((typeName) => {
      const groupFilaments = filaments.filter(
        (filament) => filament.type === typeName
      );

      if (groupFilaments.length === 0) return;

      const section = document.createElement("section");
      section.className = "filament-group";

      const heading = document.createElement("h2");
      heading.textContent = typeName;

      const grid = document.createElement("div");
      grid.className = "filament-grid";

      groupFilaments.forEach((filament) => {
        grid.appendChild(createFilamentCard(filament));
      });

      section.append(heading, grid);
      groupsContainer.appendChild(section);
    });
